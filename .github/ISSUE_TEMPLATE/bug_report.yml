name: Bug report
description: Tell us what is broken.
labels: ["bug"]
body:
  - type: dropdown
    id: site
    attributes:
      label: Which site is this about?
      options:
        - CoreSpoke hub
        - KeepAlive
        - Simplify API
        - LLM Router
        - Dispatch
        - Flows
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Steps to reproduce
  - type: markdown
    attributes:
      value: Please do not include passwords, API keys or other private data. This issue is public.
